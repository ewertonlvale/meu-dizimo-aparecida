# ============================================================================
# deploy-runtime.yml — publica o runtime Node no Cloud Run (BL-74, Fases 2 e 3)
# ============================================================================
#
# AUTOMÁTICO A CADA MERGE NA `staging` (BL-74, Fase 6). Desde o corte (25/09)
# o Cloud Run é o bot — não há mais o Apps Script como segundo lugar a
# publicar, e um merge que não entra no ar é código mergeado e esquecido.
#
#   - Merge só de documentação (Documentação/, docs/, *.md) não publica: a
#     imagem seria a mesma.
#   - À mão continua valendo (Actions → "Deploy do runtime Node" → Run
#     workflow) para republicar sem commit novo — depois de trocar um segredo
#     no Secret Manager, por exemplo.
#   - SÓ DA `staging`. A `main` anda atrás: publicar dela devolveria ao ar um
#     código mais velho, sem as fases que vieram depois.
#   - Dois merges seguidos não publicam em paralelo: o segundo espera o
#     primeiro (concurrency, abaixo).
#
# SEM CHAVE: o GitHub recebe um token temporário pelo Workload Identity
# Federation. Nenhuma credencial de longa duração existe perto deste
# repositório, que é público. O provedor só aceita ESTE repositório.
#
# DOIS SERVIÇOS, UMA IMAGEM (Fase 3):
#   meu-dizimo-worker   roda os .gs. PRIVADO para sempre: só o Cloud Tasks e o
#                       Cloud Scheduler entram, com token OIDC da conta
#                       meu-dizimo-invocador. Tem os segredos do Odoo e do
#                       WhatsApp — por isso ninguém de fora chega nele.
#   meu-dizimo-webhook  confere a assinatura da Meta e enfileira. Só tem o App
#                       Secret. Nasce PRIVADO; vira público na Fase 5, junto
#                       com a troca da URL na Meta.
# O worker sobe primeiro: o webhook precisa da URL dele.
#
# O QUE VEM DE ONDE
#   vars.*     Settings → Secrets and variables → Actions → aba Variables.
#              Não são segredo, mas ficam fora do código: o repositório é
#              público, e a URL e o banco do Odoo dizem onde bater.
#   segredos   Secret Manager da Google — o GitHub nunca os vê.

name: Deploy do runtime Node

on:
  push:
    branches: [staging]
    paths-ignore:
      - 'Documentação/**'
      - 'docs/**'
      - '*.md'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write     # para o token do Workload Identity Federation

concurrency:
  group: deploy-runtime
  cancel-in-progress: false   # dois deploys ao mesmo tempo, nunca

env:
  REGIAO: southamerica-east1
  REPOSITORIO: meu-dizimo
  WORKER: meu-dizimo-worker
  WEBHOOK: meu-dizimo-webhook
  FILA: mensagens

jobs:
  deploy:
    name: Deploy
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # O harness inteiro ANTES de publicar. Imagem de código vermelho não sobe.
      - name: Verificar
        run: node ferramentas/verificar-tudo.mjs

      - name: Autenticar na Google (sem chave)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/${{ vars.GCP_NUMERO_PROJETO }}/locations/global/workloadIdentityPools/github/providers/meu-dizimo
          service_account: meu-dizimo-deploy@${{ vars.GCP_PROJETO }}.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Construir e enviar a imagem
        run: |
          IMAGEM="${REGIAO}-docker.pkg.dev/${{ vars.GCP_PROJETO }}/${REPOSITORIO}/runtime:${GITHUB_SHA}"
          gcloud auth configure-docker "${REGIAO}-docker.pkg.dev" --quiet
          docker build -t "$IMAGEM" .
          docker push "$IMAGEM"
          echo "IMAGEM=$IMAGEM" >> "$GITHUB_ENV"

      # NOTIFICACOES_ATIVAS=false É DE PROPÓSITO. Sem a propriedade, os lembretes
      # ficam LIGADOS por padrão — e o Apps Script ainda os envia. Um /cron
      # disparado aqui por engano mandaria o lembrete em dobro para os
      # dizimistas de verdade. Vira "true" só no corte (Fase 5), junto com a
      # remoção do acionador do Apps Script.
      #
      # UM --set-env-vars SÓ. Ele e o --update-env-vars são mutuamente exclusivos
      # no gcloud, que sai com código 2 — foi o que derrubou o primeiro deploy,
      # em 25/09. O deploy define o ambiente INTEIRO: o que não estiver aqui
      # não existe no serviço.
      #
      # PROCESSADORES=2 com --concurrency=4: duas mensagens de pessoas diferentes
      # rodam juntas; as outras esperam na fila interna. Da MESMA pessoa, uma
      # por vez — a trava por pessoa manda a segunda de volta à fila (503).
      - name: Publicar o worker (privado)
        run: |
          gcloud run deploy "$WORKER" \
            --image="$IMAGEM" \
            --region="$REGIAO" \
            --service-account="meu-dizimo-bot@${{ vars.GCP_PROJETO }}.iam.gserviceaccount.com" \
            --no-allow-unauthenticated \
            --min-instances=0 --max-instances=3 \
            --cpu=1 --memory=512Mi --timeout=300 --concurrency=4 \
            --set-env-vars="PAPEL=worker,ARMAZENAMENTO=upstash,PROCESSADORES=2,NOTIFICACOES_ATIVAS=false,UPSTASH_REDIS_REST_URL=${{ vars.UPSTASH_REDIS_REST_URL }},WHATSAPP_PHONE_ID=${{ vars.WHATSAPP_PHONE_ID }},ODOO_URL=${{ vars.ODOO_URL }},ODOO_DATABASE=${{ vars.ODOO_DATABASE }},ODOO_UID=${{ vars.ODOO_UID }},VERIFY_TOKEN=${{ vars.VERIFY_TOKEN }}" \
            --set-secrets="WHATSAPP_TOKEN=WHATSAPP_TOKEN:latest,ODOO_API_KEY=ODOO_API_KEY:latest,GOOGLE_VISION_API_KEY=GOOGLE_VISION_API_KEY:latest,WEBHOOK_SECRET=WEBHOOK_SECRET:latest,UPSTASH_REDIS_REST_TOKEN=UPSTASH_REDIS_REST_TOKEN:latest"
          echo "WORKER_URL=$(gcloud run services describe "$WORKER" --region="$REGIAO" --format='value(status.url)')" >> "$GITHUB_ENV"

      # O webhook não tem os segredos do Odoo nem do WhatsApp: se o serviço
      # público for comprometido, o que se leva é a capacidade de enfileirar.
      # Ele autentica pela ASSINATURA da Meta (Fase 5), com o App Secret — o
      # WEBHOOK_SECRET ficou só no worker, entre ele e os .gs, sem sair dali.
      - name: Publicar o webhook
        run: |
          gcloud run deploy "$WEBHOOK" \
            --image="$IMAGEM" \
            --region="$REGIAO" \
            --service-account="meu-dizimo-webhook@${{ vars.GCP_PROJETO }}.iam.gserviceaccount.com" \
            --no-allow-unauthenticated \
            --min-instances=0 --max-instances=3 \
            --cpu=1 --memory=256Mi --timeout=30 --concurrency=80 \
            --set-env-vars="PAPEL=webhook,VERIFY_TOKEN=${{ vars.VERIFY_TOKEN }},FILA_PROJETO=${{ vars.GCP_PROJETO }},FILA_REGIAO=${REGIAO},FILA_NOME=${FILA},WORKER_URL=${WORKER_URL},INVOCADOR_SA=meu-dizimo-invocador@${{ vars.GCP_PROJETO }}.iam.gserviceaccount.com" \
            --set-secrets="META_APP_SECRET=META_APP_SECRET:latest"

      - name: Onde ficou
        run: |
          echo "worker:  $WORKER_URL"
          echo "webhook: $(gcloud run services describe "$WEBHOOK" --region="$REGIAO" --format='value(status.url)')"
